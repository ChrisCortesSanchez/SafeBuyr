version: '3.8'

services:
  safebuyr-vulnerable:
    build:
      context: .
      dockerfile: docker/Dockerfile.vulnerable
    container_name: safebuyr-vulnerable
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - ./app:/app/app
      - ./exploits:/app/exploits
      - ./scanner:/app/scanner
    networks:
      - safebuyr-network
    restart: unless-stopped

  safebuyr-secure:
    build:
      context: .
      dockerfile: docker/Dockerfile.secure
    container_name: safebuyr-secure
    ports:
      - "5002:5002"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECURE_MODE=1
    volumes:
      - ./app:/app/app
      - ./scanner:/app/scanner
    networks:
      - safebuyr-network
    restart: unless-stopped

networks:
  safebuyr-network:
    driver: bridge