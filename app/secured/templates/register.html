{% extends "base.html" %}

{% block title %}Create account — SafeBuyr{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card p-8">
        <h1 class="text-2xl font-bold text-center mb-1">Create your account</h1>
        <p class="text-sm text-neutral-500 text-center mb-6">Join SafeBuyr in a few seconds</p>

        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="username" class="block text-sm font-medium text-neutral-700 mb-1.5">Username</label>
                <input type="text" id="username" name="username" required minlength="3" class="field" placeholder="Choose a username">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-neutral-700 mb-1.5">Email</label>
                <input type="email" id="email" name="email" required class="field" placeholder="you@example.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-neutral-700 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required minlength="8" class="field" placeholder="Choose a password (min 8 characters)">
            </div>
            <button type="submit" class="btn btn-primary w-full">Create account</button>
        </form>

        <p class="mt-6 text-center text-sm text-neutral-500">
            Already have an account?
            <a href="{{ url_for('login') }}" class="text-brand font-medium hover:text-brand-700">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
