{% extends "base.html" %}

{% block title %}Sign in — SafeBuyr{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card p-8">
        <h1 class="text-2xl font-bold text-center mb-1">Welcome back</h1>
        <p class="text-sm text-neutral-500 text-center mb-6">Sign in to your SafeBuyr account</p>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-neutral-700 mb-1.5">Username</label>
                <input type="text" id="username" name="username" required class="field" placeholder="Enter your username">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-neutral-700 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required class="field" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary w-full">Sign in</button>
        </form>

        <p class="mt-6 text-center text-sm text-neutral-500">
            Don’t have an account?
            <a href="{{ url_for('register') }}" class="text-brand font-medium hover:text-brand-700">Create one</a>
        </p>

        <!-- Demo accounts -->
        <div class="mt-6 pt-6 border-t border-neutral-100">
            <p class="text-xs font-semibold text-neutral-400 uppercase tracking-wide mb-2">Demo accounts</p>
            <div class="grid grid-cols-2 gap-2 text-sm">
                <div class="rounded-lg bg-neutral-50 border border-neutral-100 px-3 py-2">
                    <p class="text-xs text-neutral-400">Admin</p>
                    <p class="font-mono text-neutral-700">admin / admin123</p>
                </div>
                <div class="rounded-lg bg-neutral-50 border border-neutral-100 px-3 py-2">
                    <p class="text-xs text-neutral-400">Customer</p>
                    <p class="font-mono text-neutral-700">user / password</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
